  # ================================================================================
  # Multi-hop, cross-source (20) — the core category. Requires ≥2 facts from ≥2
  # different source types.
  # ================================================================================
  - id: q.helios-delay-why-and-who
    question: "Why did the Helios launch slip, and who approved the new date?"
    category: multi-hop
    requiredFacts: [fact.helios-delay-cause, fact.helios-delay-signoff]
    requiredSources: [chat, mail]
    minHops: 1
    expectedAbstention: false
    referenceAnswer: >
      Helios slipped because the billing migration failed load testing at 4x
      expected volume; Priya Raman approved the revised 2026-04-21 date on 2026-02-20.

  - id: q.helios-full-story
    question: "What was the root cause of the Helios delay, and what happened when it eventually shipped?"
    category: multi-hop
    requiredFacts: [fact.helios-root-cause-detail, fact.helios-launch-final]
    requiredSources: [notes, mail]
    minHops: 1
    expectedAbstention: false
    referenceAnswer: >
      The root cause was a connection-pool exhaustion bug in the new Stripe
      usage-metering service under concurrent writes. Helios ultimately shipped
      2026-04-22, one day after the approved date, due to a separate last-minute
      TLS certificate renewal issue in staging.

  - id: q.northwind-report-vs-cause
    question: "What did Northwind Retail originally report, and what was actually causing it?"
    category: multi-hop
    requiredFacts: [fact.northwind-bug, fact.northwind-root-cause]
    requiredSources: [mail, notes]
    minHops: 1
    expectedAbstention: false
    referenceAnswer: >
      Northwind reported missing session replays on their mobile checkout flow
      starting 2026-02-03; the actual cause was an ad-blocker false-positive
      flagging Pulse's mobile SDK script as a tracker.

