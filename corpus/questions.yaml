  # ================================================================================
  # Distractor-heavy (8) — near-duplicate, plausible-but-wrong content exists in the
  # corpus and a shallow retrieval is likely to pick the wrong one.
  # ================================================================================
  - id: q.security-vulnerability-disambiguation
    question: "What security vulnerability did Lumen Labs disclose, and how was it resolved?"
    category: distractor
    requiredFacts: [fact.security-finding, fact.security-fix-owner, fact.security-bounty-paid]
    requiredSources: [mail, chat, notes]
    minHops: 2
    expectedAbstention: false
    referenceAnswer: >
      There were actually two separate findings. The more recent and prominent
      one: a stored XSS vulnerability in the dashboard's custom-annotation
      feature (reported 2026-02-25), fixed by Marcus Webb on 2026-02-27, with a
      $1,500 bounty paid. A good answer should note the disambiguation rather
      than silently picking one.
    notes: >
      Distractor: fact.security-finding-2 (open-redirect, 2025-11-12, fixed by
      Ben Holt, no bounty) is a separate, earlier, and textually similar finding.

  - id: q.bounty-payment-lookup
    question: "Was a bug bounty paid for a Lumen Labs security finding, and if so, how much?"
    category: distractor
    requiredFacts: [fact.security-bounty-paid]
    requiredSources: [notes]
    minHops: 0
    expectedAbstention: false
    referenceAnswer: >
      Yes, $1,500 for the stored XSS finding. (A separate, earlier open-redirect
      finding did not receive a bounty — it was out of program scope at the time.)
    notes: "Distractor: fact.security-finding-2 describes a no-bounty case for a different, earlier finding."

