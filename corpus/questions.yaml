# Question set for the "Lumen Labs" corpus (throughline PLAN.md §6/§7).
#
# `requiredFacts` point at ids in corpus/ledger/facts.yaml; a fact's `expressedIn` gives
# the exact documents that must be retrieved, which is what makes recall@k a deterministic
# check rather than an LLM judgment (see PLAN.md §7). `requiredSources` names the source
# types (mail/chat/notes) a correct answer must draw from — used to score whether the
# planner actually fanned out across sources rather than answering from one lucky retrieval.
# `minHops` is the number of *additional* retrieval rounds beyond the first expected to be
# needed (0 = single retrieval; 1 = one reflect-and-follow-up round; 2 = two).
#
# Adversarial/injection questions are deferred to M5 (PLAN.md §6) once live/adversarial
# documents exist — not included here.

questions:
  # ================================================================================
  # Single-hop (12) — one fact, one source. Also proves `triage` correctly skips
  # planning for questions that don't need it.
  # ================================================================================
