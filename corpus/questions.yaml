  # ================================================================================
  # Temporal / superseded (8) — a fact changed; only the current value is correct.
  # Punishes naive similarity retrieval that surfaces the outdated fact.
  # ================================================================================
  - id: q.current-pricing-model
    question: "What is Lumen Labs' current pricing model?"
    category: temporal
    requiredFacts: [fact.pricing-v2-decision]
    requiredSources: [notes]
    minHops: 0
    expectedAbstention: false
    referenceAnswer: >
      Usage-based pricing (billed per session recorded), effective 2026-04-01 —
      not the original seat-based model.
    notes: >
      Distractor: notes.pricing-v1-launch-doc describes the superseded seat-based
      model and is lexically similar ("pricing", "Pulse"); a correct answer must
      not return the superseded fact.

  - id: q.current-api-v2-deprecation-date
    question: "When is Pulse API v2 currently scheduled to be deprecated?"
    category: temporal
