    category: distractor
    requiredFacts: [fact.helios-delay-cause]
    requiredSources: [chat]
    minHops: 0
    expectedAbstention: false
    referenceAnswer: >
      The billing migration failed load testing at 4x expected volume.
    notes: >
      Distractor: notes.amara-personal-todo mentions "billing migration" casually
      in a personal TODO list; it is not the authoritative source and should not
      be preferred over the actual team discussion in chat.eng-helios.2026-02-18.

