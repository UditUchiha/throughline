    supersedes: null

  # ---- Storyline 9: Board update ---------------------------------------------------
  - id: fact.board-update-arr
    statement: >
      Lumen Labs reported $2.1M ARR at the 2026-02-01 board meeting, up from $1.4M
      the prior quarter.
    expressedIn: [notes.board-meeting-2026-02-01-summary]
    supersedes: null

  - id: fact.board-update-headcount
    statement: >
      The board approved a headcount increase to 35 employees by the end of 2026.
    expressedIn: [mail.thread-board-update-exec-summary.msg-1]
    supersedes: null
