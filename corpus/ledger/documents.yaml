notes:
  # ---- Fact-bearing notes ------------------------------------------------------------
  - docId: notes.helios-loadtest-postmortem
    title: "Postmortem: Helios load-test failure"
    tags: [helios, postmortem, infra]
    updated: 2026-02-19
    factIds: [fact.helios-root-cause-detail]
    brief: >
      A postmortem document explaining that the Helios load-test failure was traced
      to a connection-pool exhaustion bug in the new Stripe usage-metering service
      under concurrent writes; links to [[Helios]] and [[Billing migration]].

  - docId: notes.pricing-v1-launch-doc
    title: "Pulse pricing (2025 launch)"
    tags: [pricing, product]
    updated: 2025-06-01
    factIds: [fact.pricing-v1-decision]
    brief: >
      An early internal doc recording that Pulse launched with seat-based pricing
      at $49 per seat per month in 2025.

  - docId: notes.pricing-v2-decision-record
    title: "Decision record: usage-based pricing"
    tags: [pricing, decision-record, product]
    updated: 2026-01-14
    factIds: [fact.pricing-v2-decision]
    brief: >
      A decision record dated 2026-01-14 approving usage-based pricing (billed per
      session recorded) to replace seat-based pricing, effective 2026-04-01; notes
      that it supersedes the original 2025 pricing model, linking to
      [[Pulse pricing (2025 launch)]].

  - docId: notes.northwind-support-postmortem
    title: "Postmortem: Northwind missing session replays"
    tags: [postmortem, support, northwind]
    updated: 2026-02-09
    factIds: [fact.northwind-root-cause]
    brief: >
      A support postmortem explaining that Northwind Retail's missing session
      replays were caused by an ad-blocker false-positive flagging Pulse's mobile
      SDK script as a tracker.

  - docId: notes.infra-review-2026-01-20
    title: "Infra review — 2026-01-20"
    tags: [infra, meeting-notes]
    updated: 2026-01-20
    factIds: [fact.infra-migration-decision]
    brief: >
      Meeting notes from the 2026-01-20 infra review recording the decision to
      migrate the primary Postgres database from self-hosted to a managed
      provider (Aurora) to reduce on-call burden.

  - docId: notes.aurora-migration-risk-assessment
    title: "Aurora migration — risk assessment"
    tags: [infra, aurora-migration, risk]
    updated: 2026-04-20
    factIds: [fact.infra-migration-risk]
    brief: >
      A risk assessment identifying replication lag under the increased
      session-write volume expected after the Helios launch as the main risk for
      the Aurora cutover; links to [[Helios]].

  - docId: notes.tariq-onboarding-plan
    title: "Onboarding plan — Tariq Hassan"
    tags: [onboarding, sre]
    updated: 2026-01-04
    factIds: [fact.tariq-first-project]
    brief: >
      An onboarding plan noting Tariq Hassan's first project assignment is the
      Aurora migration, alongside Ines Dubois.

  - docId: notes.security-incident-log
    title: "Security incident log — stored XSS (2026-02-25)"
    tags: [security, incident-log]
    updated: 2026-03-01
    factIds: [fact.security-bounty-paid]
    brief: >
