# Document manifest for the "Lumen Labs" corpus (throughline PLAN.md §6).
#
# Every docId here must exactly match a docId referenced in facts.yaml's `expressedIn`
# (for fact-bearing documents) or corpus/questions.yaml. `factIds: []` marks a pure-noise
# document — realistic filler that carries no ground-truth fact, included deliberately so
# retrieval faces a realistic signal-to-noise ratio rather than uniformly dense documents
# (PLAN.md §6, "Generator"). `brief` is the instruction scripts/corpus-generate.ts hands to
# the LLM for that one document — not the document text itself.
#
# Internal email convention: firstname@lumenlabs.io. External contacts are one-off,
# invented, and intentionally NOT in entities.yaml (facts never depend on their exact
# identity — e.g. facts say "an external researcher", never a specific outside name).

