name: CI

# The always-on gate: everything that needs no API key and no quota.
# The eval suite is a separate workflow (evals.yml) because it needs both.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, build, test, conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 resolves it from the
      # `packageManager` field in package.json, which is the single place it is
      # pinned. Passing neither is not a default, it is a hard error ("No pnpm
      # version is specified") before install runs, which is how all four jobs in
      # these two workflows landed red on their first invocation.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `--fix` is deliberately dropped here: `pnpm lint` autofixes, which is right
      # on a laptop and wrong in CI, where a job that silently repairs the code it
      # is checking reports a pass for a state that was never committed.
      - name: Lint
        run: npx eslint "{src,evals,scripts}/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # PLAN.md §0.3 and §3 — the rules that were prose until M6. See
      # scripts/check-conventions.mjs for why a naive process.env grep lands red.
      - name: Conventions
        run: pnpm check:conventions

      # The answer key is the eval suite's denominator, so a ledger edit that
      # breaks it has to fail here rather than surface as a mysteriously changed
      # metric. No model calls; seconds.
      - name: Corpus answer key
        run: node -r ts-node/register scripts/corpus-generate.ts --verify-only

      # The keyless index build, which is the load-bearing half of §9's image.
      #
      # Both steps run with no API key and no network, which is the whole point:
      # `precomputed` replays the committed vectors, so this is seconds rather
      # than the ~172 embedding calls a real reindex costs. It catches the one way
      # the artifact rots — a corpus document edited, or CHUNK_SIZE changed,
      # without regenerating `corpus/index/embeddings.json` — which would
      # otherwise first appear as a failed Docker build on deployment day.
      - name: Corpus vectors are current
        env:
          EMBEDDING_PROVIDER: precomputed
        run: pnpm corpus:vectors --check

      - name: Index builds without a key
        env:
          EMBEDDING_PROVIDER: precomputed
          DATABASE_PATH: ./database/ci-index.db
        run: pnpm corpus:index

  # Proves the deployed artifact, not just the source. §9's image had never been
  # built when this landed, and building it found two failures a green test suite
  # could not: a root-owned `database/` that made sqlite's WAL unwritable under
  # `USER node`, and embedding defaults that disagreed with each other once no
  # `.env` was masking them. Both were boot failures behind a successful build, so
  # this job runs the container rather than stopping at `docker build`.
  docker:
    name: Docker — build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t throughline:ci .

      # Placeholder keys, not secrets. Every provider constructor requires a key
      # to exist — a server that cannot answer anything should say so at boot
      # rather than on a visitor's first question — but nothing here spends one:
      # the index is baked in, and `?demo=1` replays a committed fixture. So this
      # job proves the image boots and serves without any quota at all, which is
      # exactly the part `evals.yml` cannot check because it needs a real key.
      - name: Boot it and serve a recorded run
        env:
          DOCKER_ENV: >-
            -e GEMINI_API_KEY=placeholder
            -e EMBEDDING_API_KEY=placeholder
        run: |
          docker run -d --name throughline-ci -p 7860:7860 $DOCKER_ENV throughline:ci
          for _ in $(seq 1 30); do
            if curl -sf localhost:7860/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:7860/health

          # `?demo=1` replays a committed fixture and makes no model calls, so it
          # exercises the SSE surface end to end with no quota at all.
          curl -sf -N -X POST 'localhost:7860/agent/ask?demo=1' \
            -H 'Content-Type: application/json' \
            -d '{"question":"When did Tariq Hassan start at Lumen Labs?"}' \
            | grep -q 'event: run_finished'

          # The index has to be the baked one. A boot that re-indexed would still
          # answer, so "it works" is not evidence — `skipped=172` is.
          docker logs throughline-ci 2>&1 | grep -q 'indexed=0 skipped=172'

      - name: Container logs
        if: always()
        run: docker logs throughline-ci 2>&1 | tail -40

      - name: Stop the container
        if: always()
        run: docker rm -f throughline-ci

  ui:
    name: UI — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # This is what pins the hand-kept mirror of the event contract: the UI tests
      # replay the real fixtures/runs/*.json through the reducer, so an event
      # variant added on the API side without updating ui/lib/agent-events.ts
      # fails here instead of in a browser.
      - run: pnpm test
